<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    width: 720px;
    height: 1280px;
    background: radial-gradient(circle at 50% 30%, #102244 0%, #050a14 100%);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 140px;
    overflow: hidden;
    text-align: center;
  }
  .container {
    width: 640px;
    padding: 20px 20px;
  }
  .badge {
    display: inline-block;
    background: rgba(255, 210, 127, 0.15);
    border: 1px solid rgba(255, 210, 127, 0.6);
    color: #FFD27F;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 24px;
    border-radius: 24px;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 0.5px;
    color: #FFFFFF;
    text-shadow: 0 4px 16px rgba(0,0,0,0.8);
  }
  h1 span.highlight {
    color: #FFD27F;
    display: block;
    font-size: 62px;
    margin-top: 4px;
  }
  .sub-card {
    margin-top: 32px;
    background: rgba(14, 24, 44, 0.88);
    border: 1.5px solid rgba(120, 180, 255, 0.35);
    border-radius: 18px;
    padding: 24px 28px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .date-loc {
    font-size: 28px;
    font-weight: 700;
    color: #64D2FF;
    margin-bottom: 10px;
  }
  .tagline {
    font-size: 22px;
    color: #D0E0F0;
    line-height: 1.4;
  }
  .optics-tip {
    margin-top: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(100, 210, 255, 0.12);
    border: 1px solid rgba(100, 210, 255, 0.4);
    color: #64D2FF;
    font-size: 19px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 20px;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="container">
  <div class="badge">Rare Astronomical Event</div>
  <h1>
    ON NOVEMBER 3,
    <span class="highlight">JUPITER VANISHES</span>
  </h1>

  <div class="sub-card">
    <div class="date-loc">Night of 2–3 November 2026</div>
    <div class="tagline">
      A waning crescent Moon passes directly in front of Jupiter and its four Galilean moons.
    </div>
    <div class="optics-tip">
      Visible to naked eye & binoculars • Telescopes show magnified views
    </div>
  </div>
</div>
</body>
</html>
