<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020409;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #canvas-container {
    width: 720px;
    height: 1280px;
    position: absolute;
    top: 0;
    left: 0;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 720px;
    height: 1280px;
    pointer-events: none;
  }
  .hud-badge {
    position: absolute;
    top: 60px;
    left: 36px;
    background: rgba(8, 14, 28, 0.92);
    border: 1.5px solid rgba(100, 200, 255, 0.6);
    border-radius: 20px;
    padding: 10px 22px;
    color: #64D2FF;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,0,0,0.8);
  }
  .hud-card {
    position: absolute;
    bottom: 80px;
    left: 36px;
    right: 36px;
    background: rgba(10, 16, 32, 0.94);
    border: 2px solid rgba(255, 210, 127, 0.6);
    border-radius: 18px;
    padding: 20px 26px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.9);
  }
  .hud-card h2 {
    margin: 0 0 6px 0;
    color: #FFD27F;
    font-size: 30px;
    font-weight: 800;
  }
  .hud-card p {
    margin: 0 0 6px 0;
    color: #FFFFFF;
    font-size: 21px;
    font-weight: 500;
    line-height: 1.3;
  }
  .hud-sub {
    color: #00E5FF;
    font-size: 18px;
    font-weight: 600;
  }
</style>
<script src="vendor/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="overlay">
  <div class="hud-badge" id="badge">3D COSMIC GEOMETRY</div>
  <div class="hud-card" id="card">
    <h2 id="card-title">OBSERVER IN BENGALURU</h2>
    <p id="card-desc">Looking East at the pre-dawn sky</p>
    <div class="hud-sub" id="card-sub">Bengaluru: Lat 12.97° N, Lon 77.59° E</div>
  </div>
</div>

<script>
// Procedural textures
function createEarthTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#091c34';
  ctx.fillRect(0, 0, 1024, 512);

  // Continents
  ctx.fillStyle = '#1c4a24';
  ctx.beginPath();
  ctx.ellipse(560, 200, 160, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(680, 180, 170, 95, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // India
  ctx.fillStyle = '#2d6d36';
  ctx.beginPath();
  ctx.moveTo(660, 210);
  ctx.lineTo(720, 210);
  ctx.lineTo(690, 280);
  ctx.closePath();
  ctx.fill();

  // City lights
  ctx.fillStyle = '#ffe082';
  [[690, 265, 3], [705, 260, 2], [665, 245, 2.5], [675, 205, 3]].forEach(([x, y, r]) => {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 50; i++) {
    ctx.beginPath();
    const cx = (i * 91) % 1024;
    const cy = 40 + ((i * 41) % 430);
    ctx.ellipse(cx, cy, 60 + (i % 40), 12 + (i % 10), (i * 0.15), 0, Math.PI * 2);
    ctx.fill();
  }

  // Ice caps
  ctx.fillStyle = '#eef8ff';
  ctx.fillRect(0, 0, 1024, 25);
  ctx.fillRect(0, 490, 1024, 22);

  return new THREE.CanvasTexture(c);
}

function createMoonTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8a8d92';
  ctx.fillRect(0, 0, 512, 256);
  // Maria
  ctx.fillStyle = '#55585d';
  ctx.beginPath();
  ctx.ellipse(200, 110, 80, 60, 0.2, 0, Math.PI * 2);
  ctx.ellipse(290, 95, 70, 55, -0.3, 0, Math.PI * 2);
  ctx.ellipse(240, 165, 60, 45, 0, 0, Math.PI * 2);
  ctx.fill();
  // Craters
  ctx.fillStyle = '#b5bac0';
  for (let i = 0; i < 80; i++) {
    const rx = (i * 57) % 512;
    const ry = (i * 41) % 256;
    ctx.beginPath();
    ctx.arc(rx, ry, 2 + (i % 6), 0, Math.PI * 2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function createJupiterTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  const bands = [
    { y: 0, h: 45, col: '#8a7c6a' },
    { y: 45, h: 35, col: '#cbb79a' },
    { y: 80, h: 40, col: '#a98563' },
    { y: 120, h: 30, col: '#eadfce' },
    { y: 150, h: 55, col: '#b86e48' },
    { y: 205, h: 40, col: '#f4ebd8' },
    { y: 245, h: 60, col: '#9f5b3a' },
    { y: 305, h: 40, col: '#ecd9c2' },
    { y: 345, h: 45, col: '#aa8466' },
    { y: 390, h: 45, col: '#c8ae91' },
    { y: 435, h: 77, col: '#7b7063' }
  ];
  bands.forEach(b => {
    ctx.fillStyle = b.col;
    ctx.fillRect(0, b.y, 1024, b.h);
  });
  // Great Red Spot
  ctx.fillStyle = '#d04f26';
  ctx.beginPath();
  ctx.ellipse(660, 275, 58, 34, -0.05, 0, Math.PI * 2);
  ctx.fill();
  // Swirls
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 3;
  for (let y = 90; y < 430; y += 26) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x < 1024; x += 40) {
      ctx.quadraticCurveTo(x + 20, y + ((x % 80 === 0) ? 6 : -6), x + 40, y);
    }
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

// Scene setup
const width = 720;
const height = 1280;
const scene = new THREE.Scene();
// 52 deg vertical FOV, generous depth buffer to completely prevent clipping
const camera = new THREE.PerspectiveCamera(52, width / height, 0.5, 4000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(width, height);
renderer.setPixelRatio(1);
document.getElementById('canvas-container').appendChild(renderer.domElement);

// Stars
const starCount = 2200;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i += 3) {
  starPos[i] = (Math.random() - 0.5) * 2200;
  starPos[i+1] = (Math.random() - 0.5) * 2200;
  starPos[i+2] = (Math.random() - 0.5) * 2200;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, transparent: true, opacity: 0.9 })));

// Lighting
const ambientLight = new THREE.AmbientLight(0x283244, 1.2);
scene.add(ambientLight);
const sunLight = new THREE.DirectionalLight(0xfffaec, 2.5);
sunLight.position.set(-150, 100, 120);
scene.add(sunLight);

// =====================================================================
// GEOMETRY SETUP ALIGNED FOR 9:16 PORTRAIT FRAMING
// =====================================================================

// Earth center at (0, -12, 0)
const earthRadius = 9.0;
const earthPos = new THREE.Vector3(0, -12, 0);
const earthGeo = new THREE.SphereGeometry(earthRadius, 48, 48);
const earthMat = new THREE.MeshStandardMaterial({
  map: createEarthTexture(),
  roughness: 0.7,
  metalness: 0.1
});
const earth = new THREE.Mesh(earthGeo, earthMat);
earth.position.copy(earthPos);
earth.rotation.y = -Math.PI * 0.35;
scene.add(earth);

// Atmosphere halo
const atmosGeo = new THREE.SphereGeometry(earthRadius * 1.04, 36, 36);
const atmosMat = new THREE.MeshBasicMaterial({
  color: 0x4aa3df,
  transparent: true,
  opacity: 0.28,
  side: THREE.BackSide
});
const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
atmosMesh.position.copy(earthPos);
scene.add(atmosMesh);

// Bengaluru on Earth surface
const bPos = new THREE.Vector3(0, earthPos.y + earthRadius, 0); // (0, -3, 0)

// Observer Ground & Model
const observerGroup = new THREE.Group();
const groundDisc = new THREE.Mesh(new THREE.CircleGeometry(1.0, 24), new THREE.MeshBasicMaterial({ color: 0x142818, side: THREE.DoubleSide }));
groundDisc.rotation.x = Math.PI / 2;
observerGroup.add(groundDisc);

// Human silhouette
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.6, 8), new THREE.MeshBasicMaterial({ color: 0x050810 }));
body.position.set(0, 0.3, 0);
observerGroup.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), new THREE.MeshBasicMaterial({ color: 0x050810 }));
head.position.set(0, 0.68, 0);
observerGroup.add(head);

// Telescope on tripod
const tripod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.2, 0.6, 6), new THREE.MeshBasicMaterial({ color: 0x050810 }));
tripod.position.set(0.35, 0.3, 0.1);
observerGroup.add(tripod);
const scopeTube = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.7, 8), new THREE.MeshBasicMaterial({ color: 0x64d2ff }));
scopeTube.position.set(0.35, 0.68, 0.1);
scopeTube.rotation.x = Math.PI / 3.5;
observerGroup.add(scopeTube);

observerGroup.position.copy(bPos);
scene.add(observerGroup);

// Glowing locator beacon
const beaconGeo = new THREE.RingGeometry(0.5, 0.9, 32);
const beaconMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
const beacon = new THREE.Mesh(beaconGeo, beaconMat);
beacon.position.copy(bPos.clone().add(new THREE.Vector3(0, 0.05, 0)));
beacon.rotation.x = Math.PI / 2;
scene.add(beacon);

// Direction from Bengaluru to Jupiter: Altitude 28 degrees
const altRad = 28.0 * Math.PI / 180.0;
const jupDir = new THREE.Vector3(0, Math.sin(altRad), Math.cos(altRad)).normalize();

// Jupiter at distance 75
const jupDist = 75;
const jupPos = bPos.clone().add(jupDir.clone().multiplyScalar(jupDist));
const jupRadius = 6.5;
const jupGeo = new THREE.SphereGeometry(jupRadius, 48, 48);
const jupMat = new THREE.MeshStandardMaterial({
  map: createJupiterTexture(),
  roughness: 0.6
});
const jupiter = new THREE.Mesh(jupGeo, jupMat);
jupiter.position.copy(jupPos);
scene.add(jupiter);

// Galilean moons around Jupiter
const gMoonOffsets = [
  new THREE.Vector3(-10, 1.5, 2),
  new THREE.Vector3(-6, -1, 1),
  new THREE.Vector3(8, 1.5, -1),
  new THREE.Vector3(14, -1.5, 2)
];
gMoonOffsets.forEach((off, idx) => {
  const gGeo = new THREE.SphereGeometry(idx === 2 ? 0.6 : 0.4, 16, 16);
  const gMesh = new THREE.Mesh(gGeo, new THREE.MeshBasicMaterial({ color: 0xf4eedb }));
  gMesh.position.copy(jupPos.clone().add(off));
  scene.add(gMesh);
});

// Moon intersecting point along sightline (distance 28)
const sightlineIntersect = bPos.clone().add(jupDir.clone().multiplyScalar(28));
const moonRadius = 2.4;
const moonGeo = new THREE.SphereGeometry(moonRadius, 32, 32);
const moonMat = new THREE.MeshStandardMaterial({
  map: createMoonTexture(),
  roughness: 0.9
});
const moon = new THREE.Mesh(moonGeo, moonMat);
scene.add(moon);

// Laser sightline tube (bright glowing cyan beam)
const lineCurve = new THREE.LineCurve3(bPos, jupPos);
const tubeGeo = new THREE.TubeGeometry(lineCurve, 64, 0.22, 8, false);
const tubeMat = new THREE.MeshBasicMaterial({
  color: 0x00ffff,
  transparent: true,
  opacity: 0.85
});
const sightLineMesh = new THREE.Mesh(tubeGeo, tubeMat);
scene.add(sightLineMesh);

// Glowing impact spot when occulting
const impactGeo = new THREE.SphereGeometry(0.5, 16, 16);
const impactMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.0 });
const impactMesh = new THREE.Mesh(impactGeo, impactMat);
scene.add(impactMesh);

// System center for framing
const sysCenter = earthPos.clone().add(jupPos).multiplyScalar(0.5);
// Alignment vector from Earth to Jupiter
const lineDir = jupPos.clone().sub(earthPos).normalize();

// Keyframe endpoints:
const c_start = bPos.clone().add(new THREE.Vector3(-3.5, 1.2, -3.5));
const c_mid   = sysCenter.clone().add(new THREE.Vector3(-80.0, 0.0, 0.0));
const c_end   = sysCenter.clone().add(new THREE.Vector3(-110.0, 0.0, 0.0));

const l_start = bPos.clone().add(jupDir.clone().multiplyScalar(18.0));
const l_end   = sysCenter.clone();

// Smooth camera motion function
window.getCameraState = function(progress) {
  let camPos = new THREE.Vector3();
  let lookPos = new THREE.Vector3();
  let camUp = new THREE.Vector3();

  if (progress < 0.35) {
    // -----------------------------------------------------------------
    // PHASE 1 & 2: Ground observer to Orbit Ascent (0.0 to 0.35)
    // Starts over observer shoulder, rises into orbit
    // -----------------------------------------------------------------
    const p = progress / 0.35;
    const sp = p * p * (3 - 2 * p);

    camPos.lerpVectors(c_start, c_mid, sp);
    lookPos.lerpVectors(l_start, l_end, sp);
    camUp.lerpVectors(new THREE.Vector3(0, 1, 0), lineDir, sp).normalize();

  } else {
    // -----------------------------------------------------------------
    // PHASE 3 & 4: Deep-Space Cosmic Alignment & Occultation (0.35 to 1.0)
    // Steady, majestic vantage point where all bodies are completely framed
    // -----------------------------------------------------------------
    const p = (progress - 0.35) / 0.65;
    const sp = p * p * (3 - 2 * p);

    camPos.lerpVectors(c_mid, c_end, sp);
    lookPos.copy(l_end);
    camUp.copy(lineDir);
  }

  return { camPos, lookPos, camUp };
};

window.renderFrameAt = function(progress) {
  // Moon sweeps horizontally across the laser sightline
  // At progress = 0.88, Moon center is exactly at X = 0 (cutting the line!)
  let moonX;
  if (progress < 0.45) {
    moonX = 8.5; // parked just off the line
  } else {
    const sweep = (progress - 0.45) / 0.55; // 0.0 to 1.0
    moonX = 8.5 - sweep * 16.0; // sweeps from +8.5 to -7.5
  }
  moon.position.set(moonX, sightlineIntersect.y, sightlineIntersect.z);

  // Impact glow when occulting
  const isObstructed = Math.abs(moonX) < (moonRadius * 0.95);
  impactMat.opacity = isObstructed ? 0.9 : 0.0;
  if (isObstructed) {
    impactMesh.position.set(0, sightlineIntersect.y, sightlineIntersect.z);
  }

  // Camera update
  const { camPos, lookPos, camUp } = window.getCameraState(progress);
  camera.position.copy(camPos);
  camera.up.copy(camUp);
  camera.lookAt(lookPos);

  // Slow natural rotations
  earth.rotation.y = -Math.PI * 0.35 + progress * 0.15;
  jupiter.rotation.y = progress * 0.3;

  // Beacon pulse
  const pulse = 0.5 + 0.5 * Math.sin(progress * 25);
  beacon.scale.set(1 + pulse * 0.2, 1 + pulse * 0.2, 1);
  beaconMat.opacity = 0.6 + 0.4 * pulse;

  // Subtitles & HUD
  const badge = document.getElementById('badge');
  const title = document.getElementById('card-title');
  const desc = document.getElementById('card-desc');
  const sub = document.getElementById('card-sub');

  if (progress < 0.22) {
    badge.innerText = "GROUND OBSERVER  •  BENGALURU";
    title.innerText = "OBSERVER LOOKING AT THE SKY";
    desc.innerText = "Standing under the pre-dawn sky with telescope";
    sub.innerText = "Target: Moon & Jupiter rising in the East";
    sightLineMesh.visible = (progress > 0.10);
  } else if (progress < 0.50) {
    badge.innerText = "DRONE ASCENT  •  CISLUNAR ORBIT";
    title.innerText = "CLIMBING INTO SPACE";
    desc.innerText = "A laser-straight line connects Bengaluru to Jupiter";
    sub.innerText = "Earth & Moon revealed in orbital space";
    sightLineMesh.visible = true;
  } else if (progress < 0.78) {
    badge.innerText = "COSMIC GEOMETRY  •  DEEP SPACE";
    title.innerText = "EARTH • MOON • JUPITER ALIGNMENT";
    desc.innerText = "Looking along the 750,000,000 km sightline";
    sub.innerText = "The Moon approaches the line of sight";
    sightLineMesh.visible = true;
  } else {
    badge.innerText = "OCCULTATION  •  ALIGNMENT COMPLETE";
    title.innerText = "MOON BLOCKS JUPITER!";
    desc.innerText = "The Moon passes directly across the line of sight";
    sub.innerText = "Total Occultation Duration from Bengaluru: 35 min";
    sightLineMesh.visible = true;
  }

  renderer.render(scene, camera);
};

// Initial frame
window.renderFrameAt(0.02);
</script>
</body>
</html>
